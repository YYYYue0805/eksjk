# ============================================================
# Vue.js 前端 K8s 部署清单
# 包含: Deployment + Service (NodePort 对外暴露)
# ============================================================

---
# 前端 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eksjk-frontend
  namespace: eksjk
  labels:
    app: eksjk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eksjk-frontend
  template:
    metadata:
      labels:
        app: eksjk-frontend
    spec:
      containers:
        - name: frontend
          image: eksjk-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# 前端 Service（NodePort 对外暴露，方便本地访问）
apiVersion: v1
kind: Service
metadata:
  name: eksjk-frontend
  namespace: eksjk
  labels:
    app: eksjk-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30180
      protocol: TCP
  selector:
    app: eksjk-frontend
