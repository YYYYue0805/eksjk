# ============================================================
# Django 后端 K8s 部署清单
# 包含: PersistentVolumeClaim + Deployment + Service
# ============================================================

---
# 后端文件存储 PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-storage-pvc
  namespace: eksjk
  labels:
    app: eksjk-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# Django 后端 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eksjk-backend
  namespace: eksjk
  labels:
    app: eksjk-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eksjk-backend
  template:
    metadata:
      labels:
        app: eksjk-backend
    spec:
      # 等待 MySQL 就绪的 initContainer
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "等待 MySQL 就绪..."
              until nc -z eksjk-mysql 3306; do
                echo "MySQL 尚未就绪，等待中..."
                sleep 3
              done
              echo "MySQL 已就绪！"
        - name: cleanup-tables
          image: mysql:8.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "清理可能残留的迁移表..."
              mysql -h eksjk-mysql -u root -p"$DB_PASSWORD" "$DB_NAME" -e "DROP TABLE IF EXISTS datamain_masfoll; DROP TABLE IF EXISTS datamain_mas;" 2>&1
              echo "清理退出码: $?"
              mysql -h eksjk-mysql -u root -p"$DB_PASSWORD" "$DB_NAME" -e "SHOW TABLES LIKE 'datamain_mas%';" 2>&1
              echo "清理完成"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eksjk-secret
                  key: db-password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: eksjk-config
                  key: db-name
        - name: django-migrate
          image: eksjk-backend:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - >
              echo "开始执行数据库迁移..." &&
              python manage.py migrate --noinput 2>&1 &&
              echo "数据库迁移完成" ||
              (echo "迁移失败！" && exit 1)
          envFrom:
            - configMapRef:
                name: eksjk-config
            - secretRef:
                name: eksjk-secret
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "wjwsjk.settings_k8s"
            - name: DB_HOST
              value: "eksjk-mysql"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eksjk-secret
                  key: db-password
      containers:
        - name: backend
          image: eksjk-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "wjwsjk.settings_k8s"
            - name: DB_HOST
              value: "eksjk-mysql"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: eksjk-config
                  key: db-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: eksjk-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eksjk-secret
                  key: db-password
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: eksjk-secret
                  key: django-secret-key
            - name: STORAGE_ROOT
              value: "/data/storage"
          volumeMounts:
            - name: backend-storage
              mountPath: /data/storage
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /admin/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: backend-storage-pvc

---
# Django 后端 Service（集群内部访问）
apiVersion: v1
kind: Service
metadata:
  name: eksjk-backend
  namespace: eksjk
  labels:
    app: eksjk-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: eksjk-backend
