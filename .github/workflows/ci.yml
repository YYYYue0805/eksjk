name: CI - 构建与镜像推送

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main

# 同一分支只保留最新一次运行，取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: eksjk
  IMAGE_BACKEND: eksjk-backend
  IMAGE_FRONTEND: eksjk-frontend

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 后端构建 + 镜像推送
  # ─────────────────────────────────────────────
  build-backend:
    name: 后端构建 & 推送镜像
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 缓存 Maven 依赖，加速构建
      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('eksjk_v2/eksjk-backend/pom.xml', 'eksjk_v2/eksjk-backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # 生成镜像 tag：develop-{short_sha}
      - name: 生成镜像 Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          IMAGE_TAG="${BRANCH}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "生成镜像 Tag: ${IMAGE_TAG}"

      # Maven 编译打包（跳过测试）
      - name: Maven 编译打包
        working-directory: eksjk_v2/eksjk-backend
        run: |
          set -e
          mvn clean package -DskipTests -B -q
          echo "✅ Maven 构建成功"

      # 登录阿里云 ACR
      - name: 登录阿里云 ACR
        run: |
          set -e
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ secrets.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin
          echo "✅ ACR 登录成功"

      # 构建并推送后端镜像
      - name: 构建并推送后端镜像
        working-directory: eksjk_v2/eksjk-backend
        run: |
          set -e
          FULL_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_BACKEND}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

          docker build -t "${FULL_IMAGE}:${IMAGE_TAG}" .
          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          echo "✅ 后端镜像推送成功: ${FULL_IMAGE}:${IMAGE_TAG}"

  # ─────────────────────────────────────────────
  # Job 2: 前端构建 + 镜像推送
  # ─────────────────────────────────────────────
  build-frontend:
    name: 前端构建 & 推送镜像
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 缓存 npm 依赖，加速构建
      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: eksjk_v2/eksjk-frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('eksjk_v2/eksjk-frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 生成镜像 tag（与后端保持一致）
      - name: 生成镜像 Tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          IMAGE_TAG="${BRANCH}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "生成镜像 Tag: ${IMAGE_TAG}"

      # 安装依赖并构建前端
      - name: 安装依赖并构建前端
        working-directory: eksjk_v2/eksjk-frontend
        run: |
          set -e
          npm install
          npm run build
          echo "✅ 前端构建成功"

      # 登录阿里云 ACR
      - name: 登录阿里云 ACR
        run: |
          set -e
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ secrets.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      # 构建并推送前端镜像
      - name: 构建并推送前端镜像
        working-directory: eksjk_v2/eksjk-frontend
        run: |
          set -e
          FULL_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_FRONTEND}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

          docker build -t "${FULL_IMAGE}:${IMAGE_TAG}" .
          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          echo "✅ 前端镜像推送成功: ${FULL_IMAGE}:${IMAGE_TAG}"

  # ─────────────────────────────────────────────
  # Job 3: CI 结果汇总通知
  # ─────────────────────────────────────────────
  notify:
    name: CI 结果通知
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()

    steps:
      - name: 汇总 CI 结果
        run: |
          BACKEND_STATUS="${{ needs.build-backend.result }}"
          FRONTEND_STATUS="${{ needs.build-frontend.result }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"

          if [[ "$BACKEND_STATUS" == "success" && "$FRONTEND_STATUS" == "success" ]]; then
            STATUS_ICON="✅"
            STATUS_TEXT="成功"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="失败（后端: ${BACKEND_STATUS}, 前端: ${FRONTEND_STATUS}）"
          fi

          echo "================================================"
          echo "${STATUS_ICON} CI 构建${STATUS_TEXT}"
          echo "分支: ${BRANCH}"
          echo "Commit: ${SHORT_SHA}"
          echo "镜像 Tag: ${BRANCH}-${SHORT_SHA}"
          echo "Actions 链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "================================================"
