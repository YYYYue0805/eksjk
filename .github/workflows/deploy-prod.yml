name: CD - 部署到 Production 环境

on:
  # 创建 release/v* 格式的 Tag 时触发生产部署
  push:
    tags:
      - 'release/v*'

# 同一时间只允许一个 prod 部署运行，避免并发冲突
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: eksjk
  IMAGE_BACKEND: eksjk-backend
  IMAGE_FRONTEND: eksjk-frontend
  K8S_NAMESPACE: eksjk-prod
  ENV_NAME: prod

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 构建生产镜像并推送到 ACR
  # ─────────────────────────────────────────────
  build:
    name: 构建生产镜像 & 推送 ACR
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.meta.outputs.version_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 解析版本号：release/v1.2.0 → v1.2.0
      - name: 解析版本 Tag
        id: meta
        run: |
          set -e
          RAW_TAG="${{ github.ref_name }}"
          # 去掉 release/ 前缀，得到 v1.2.0
          VERSION_TAG="${RAW_TAG#release/}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "🏷️ 生产版本 Tag: ${VERSION_TAG} (commit: ${SHORT_SHA})"

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 缓存 Maven 依赖
      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('eksjk_v2/eksjk-backend/pom.xml', 'eksjk_v2/eksjk-backend/**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 缓存 npm 依赖
      - name: 缓存 npm 依赖
        uses: actions/cache@v4
        with:
          path: eksjk_v2/eksjk-frontend/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('eksjk_v2/eksjk-frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 登录阿里云 ACR
      - name: 登录阿里云 ACR
        run: |
          set -e
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ secrets.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin
          echo "✅ ACR 登录成功"

      # 构建并推送后端镜像（打版本 tag + latest）
      - name: 构建并推送后端镜像
        working-directory: eksjk_v2/eksjk-backend
        run: |
          set -e
          mvn clean package -DskipTests -B -q
          echo "✅ Maven 构建成功"

          FULL_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_BACKEND}"
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"

          docker build -t "${FULL_IMAGE}:${VERSION_TAG}" .
          docker tag "${FULL_IMAGE}:${VERSION_TAG}" "${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:${VERSION_TAG}"
          docker push "${FULL_IMAGE}:latest"
          echo "✅ 后端镜像推送成功: ${FULL_IMAGE}:${VERSION_TAG} + latest"

      # 构建并推送前端镜像（打版本 tag + latest）
      - name: 构建并推送前端镜像
        working-directory: eksjk_v2/eksjk-frontend
        run: |
          set -e
          npm install
          npm run build
          echo "✅ 前端构建成功"

          FULL_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_FRONTEND}"
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"

          docker build -t "${FULL_IMAGE}:${VERSION_TAG}" .
          docker tag "${FULL_IMAGE}:${VERSION_TAG}" "${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:${VERSION_TAG}"
          docker push "${FULL_IMAGE}:latest"
          echo "✅ 前端镜像推送成功: ${FULL_IMAGE}:${VERSION_TAG} + latest"

  # ─────────────────────────────────────────────
  # Job 2: 人工审批门控（需在 GitHub Environment 中配置 Required Reviewer）
  # 审批人在 GitHub Actions 界面点击 "Review deployments" 确认后继续
  # ─────────────────────────────────────────────
  approve:
    name: 等待人工审批
    runs-on: ubuntu-latest
    needs: build
    # 使用 production environment，需在 GitHub Repository Settings 中配置
    # Settings → Environments → production → Required reviewers（至少 1 人）
    environment: production
    steps:
      - name: 审批通过，准备部署到生产环境
        run: |
          echo "✅ 审批通过，开始部署到生产环境"
          echo "版本: ${{ needs.build.outputs.version_tag }}"
          echo "Commit: ${{ needs.build.outputs.short_sha }}"

  # ─────────────────────────────────────────────
  # Job 3: GitOps 更新 K8s 清单 + 部署到 Production
  # ─────────────────────────────────────────────
  deploy:
    name: 部署到 Production (eksjk-prod)
    runs-on: ubuntu-latest
    needs: [build, approve]

    steps:
      - name: 检出代码（含写权限，用于 git push）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 安装 yq（用于更新 YAML 中的镜像 tag）
      - name: 安装 yq
        run: |
          set -e
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      # GitOps：更新 k8s/prod 中的镜像 tag
      - name: 更新 Production K8s 清单镜像版本
        run: |
          set -e
          VERSION_TAG="${{ needs.build.outputs.version_tag }}"
          BACKEND_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_BACKEND}:${VERSION_TAG}"
          FRONTEND_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_FRONTEND}:${VERSION_TAG}"

          echo "🔄 更新后端镜像为: ${BACKEND_IMAGE}"
          yq e ".spec.template.spec.containers[0].image = \"${BACKEND_IMAGE}\"" \
            -i eksjk_v2/k8s/prod/backend/deployment.yaml

          echo "🔄 更新前端镜像为: ${FRONTEND_IMAGE}"
          yq e ".spec.template.spec.containers[0].image = \"${FRONTEND_IMAGE}\"" \
            -i eksjk_v2/k8s/prod/frontend/deployment.yaml

          echo "✅ K8s 清单镜像版本已更新"

      # GitOps：提交镜像版本变更到 Git
      - name: 提交镜像版本变更到 Git
        run: |
          set -e
          VERSION_TAG="${{ needs.build.outputs.version_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add eksjk_v2/k8s/prod/backend/deployment.yaml
          git add eksjk_v2/k8s/prod/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "⏭️ 镜像版本未变化，跳过 git commit"
          else
            # [skip ci] 防止触发新一轮 CI
            git commit -m "chore(deploy): update prod image to ${VERSION_TAG} [skip ci]"
            git push origin HEAD:main
            echo "✅ 镜像版本变更已提交到 Git"
          fi

      # 配置 kubectl 连接 ACK 集群
      - name: 配置 kubectl (ACK KubeConfig)
        run: |
          set -e
          mkdir -p ~/.kube
          echo "${{ secrets.ACK_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info
          echo "✅ kubectl 配置完成"

      # 确保 Namespace 存在
      - name: 应用 Namespace & ResourceQuota
        run: |
          set -e
          kubectl apply -f eksjk_v2/k8s/prod/namespace.yaml
          echo "✅ Namespace eksjk-prod 已就绪"

      # 部署后端
      - name: 部署后端到 Production
        run: |
          set -e
          kubectl apply -f eksjk_v2/k8s/prod/backend/
          echo "✅ 后端清单已应用"

      # 部署前端
      - name: 部署前端到 Production
        run: |
          set -e
          kubectl apply -f eksjk_v2/k8s/prod/frontend/
          echo "✅ 前端清单已应用"

      # 等待后端滚动更新完成
      - name: 等待后端 Pod 就绪
        id: wait-backend
        run: |
          set -e
          kubectl rollout status deployment/eksjk-backend \
            -n ${K8S_NAMESPACE} --timeout=120s
          echo "✅ 后端 Pod 已就绪"

      # 等待前端滚动更新完成
      - name: 等待前端 Pod 就绪
        id: wait-frontend
        run: |
          set -e
          kubectl rollout status deployment/eksjk-frontend \
            -n ${K8S_NAMESPACE} --timeout=120s
          echo "✅ 前端 Pod 已就绪"

      # 部署失败时自动回滚
      - name: 自动回滚（仅在部署失败时执行）
        if: failure() && (steps.wait-backend.outcome == 'failure' || steps.wait-frontend.outcome == 'failure')
        run: |
          echo "❌ 部署失败，开始自动回滚..."
          kubectl rollout undo deployment/eksjk-backend -n ${K8S_NAMESPACE} || true
          kubectl rollout undo deployment/eksjk-frontend -n ${K8S_NAMESPACE} || true
          echo "⏪ 回滚指令已发送，等待 Pod 恢复..."
          kubectl rollout status deployment/eksjk-backend -n ${K8S_NAMESPACE} --timeout=60s || true
          kubectl rollout status deployment/eksjk-frontend -n ${K8S_NAMESPACE} --timeout=60s || true
          echo "⚠️ 已回滚到上一个稳定版本"

      # 打印部署摘要
      - name: 打印部署摘要
        if: success()
        run: |
          VERSION_TAG="${{ needs.build.outputs.version_tag }}"
          echo "================================================"
          echo "✅ Production 部署成功"
          echo "环境: eksjk-prod"
          echo "版本 Tag: ${VERSION_TAG}"
          echo "Commit: ${{ github.sha }}"
          echo "================================================"
          kubectl get pods -n ${K8S_NAMESPACE}

  # ─────────────────────────────────────────────
  # Job 4: 创建 GitHub Release（部署成功后自动生成）
  # ─────────────────────────────────────────────
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: success()

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 自动生成 Release Notes（基于本次 Tag 与上一个 Tag 之间的 commit）
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ needs.build.outputs.version_tag }}"
          generate_release_notes: true
          body: |
            ## 🚀 生产环境部署成功

            **版本：** `${{ needs.build.outputs.version_tag }}`
            **Commit：** `${{ needs.build.outputs.short_sha }}`
            **部署时间：** ${{ github.event.head_commit.timestamp }}

            ### 镜像信息
            - 后端：`${{ secrets.ACR_REGISTRY }}/eksjk/eksjk-backend:${{ needs.build.outputs.version_tag }}`
            - 前端：`${{ secrets.ACR_REGISTRY }}/eksjk/eksjk-frontend:${{ needs.build.outputs.version_tag }}`

            ### 变更内容
            <!-- 以下为自动生成的 commit 列表 -->
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 5: 部署结果通知（无论成功失败都执行）
  # ─────────────────────────────────────────────
  notify:
    name: 部署结果通知
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'

    steps:
      - name: 发送部署结果通知
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          VERSION_TAG="${{ needs.build.outputs.version_tag }}"
          SHORT_SHA="${{ needs.build.outputs.short_sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            STATUS_ICON="✅"
            STATUS_TEXT="部署成功"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="部署失败（已自动回滚）"
          fi

          echo "================================================"
          echo "${STATUS_ICON} Production ${STATUS_TEXT}"
          echo "环境:     eksjk-prod"
          echo "版本 Tag: ${VERSION_TAG}"
          echo "Commit:   ${SHORT_SHA}"
          echo "详情:     ${RUN_URL}"
          echo "================================================"
          # 如需接入钉钉/企业微信，在此处添加 curl webhook 调用
