name: CD - 部署到 Staging 环境

on:
  # develop 分支 push 后，等待 CI workflow 成功完成再触发
  workflow_run:
    workflows: ["CI - 构建与镜像推送"]
    types:
      - completed
    branches:
      - develop

# 同一时间只允许一个 staging 部署运行，避免并发冲突
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: eksjk
  IMAGE_BACKEND: eksjk-backend
  IMAGE_FRONTEND: eksjk-frontend
  K8S_NAMESPACE: eksjk-staging
  ENV_NAME: staging

jobs:
  # ─────────────────────────────────────────────
  # 前置检查：仅在 CI 成功时继续
  # ─────────────────────────────────────────────
  check-ci:
    name: 检查 CI 状态
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image_tag: ${{ steps.get-tag.outputs.image_tag }}
      short_sha: ${{ steps.get-tag.outputs.short_sha }}
    steps:
      - name: 获取触发本次部署的 commit SHA
        id: get-tag
        run: |
          # 从触发 CI 的 workflow_run 中获取 commit sha
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA=$(echo "${SHA}" | cut -c1-7)
          IMAGE_TAG="develop-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "📦 本次部署镜像 Tag: ${IMAGE_TAG}"

  # ─────────────────────────────────────────────
  # Job: GitOps 更新 K8s 清单 + 部署到 Staging
  # ─────────────────────────────────────────────
  deploy:
    name: 部署到 Staging (eksjk-staging)
    runs-on: ubuntu-latest
    needs: check-ci
    environment: staging

    steps:
      - name: 检出代码（含写权限，用于 git push）
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 安装 yq（用于更新 YAML 中的镜像 tag）──
      - name: 安装 yq
        run: |
          set -e
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      # ── GitOps：更新 k8s/staging 中的镜像 tag ──
      - name: 更新 Staging K8s 清单镜像版本
        run: |
          set -e
          IMAGE_TAG="${{ needs.check-ci.outputs.image_tag }}"
          BACKEND_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_BACKEND}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_FRONTEND}:${IMAGE_TAG}"

          echo "🔄 更新后端镜像为: ${BACKEND_IMAGE}"
          yq e ".spec.template.spec.containers[0].image = \"${BACKEND_IMAGE}\"" \
            -i eksjk_v2/k8s/staging/backend/deployment.yaml

          echo "🔄 更新前端镜像为: ${FRONTEND_IMAGE}"
          yq e ".spec.template.spec.containers[0].image = \"${FRONTEND_IMAGE}\"" \
            -i eksjk_v2/k8s/staging/frontend/deployment.yaml

          echo "✅ K8s 清单镜像版本已更新"

      # ── GitOps：提交镜像版本变更到 Git ──
      - name: 提交镜像版本变更到 Git
        run: |
          set -e
          IMAGE_TAG="${{ needs.check-ci.outputs.image_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add eksjk_v2/k8s/staging/backend/deployment.yaml
          git add eksjk_v2/k8s/staging/frontend/deployment.yaml

          # 如果没有变更则跳过提交
          if git diff --cached --quiet; then
            echo "⏭️ 镜像版本未变化，跳过 git commit"
          else
            # [skip ci] 防止触发新一轮 CI
            git commit -m "chore(deploy): update staging image to ${IMAGE_TAG} [skip ci]"
            git push origin develop
            echo "✅ 镜像版本变更已提交到 Git"
          fi

      # ── 配置 kubectl 连接 ACK 集群 ──
      - name: 配置 kubectl (ACK KubeConfig)
        run: |
          set -e
          mkdir -p ~/.kube
          echo "${{ secrets.ACK_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info
          echo "✅ kubectl 配置完成"

      # ── 确保 Namespace 存在 ──
      - name: 应用 Namespace & ResourceQuota
        run: |
          set -e
          kubectl apply -f eksjk_v2/k8s/staging/namespace.yaml
          echo "✅ Namespace eksjk-staging 已就绪"

      # ── 部署后端 ──
      - name: 部署后端到 Staging
        run: |
          set -e
          kubectl apply -f eksjk_v2/k8s/staging/backend/
          echo "✅ 后端清单已应用"

      # ── 部署前端 ──
      - name: 部署前端到 Staging
        run: |
          set -e
          kubectl apply -f eksjk_v2/k8s/staging/frontend/
          echo "✅ 前端清单已应用"

      # ── 等待后端滚动更新完成 ──
      - name: 等待后端 Pod 就绪
        id: wait-backend
        run: |
          set -e
          kubectl rollout status deployment/eksjk-backend \
            -n ${K8S_NAMESPACE} --timeout=120s
          echo "✅ 后端 Pod 已就绪"

      # ── 等待前端滚动更新完成 ──
      - name: 等待前端 Pod 就绪
        id: wait-frontend
        run: |
          set -e
          kubectl rollout status deployment/eksjk-frontend \
            -n ${K8S_NAMESPACE} --timeout=120s
          echo "✅ 前端 Pod 已就绪"

      # ── 部署失败时自动回滚 ──
      - name: 自动回滚（仅在部署失败时执行）
        if: failure() && (steps.wait-backend.outcome == 'failure' || steps.wait-frontend.outcome == 'failure')
        run: |
          echo "❌ 部署失败，开始自动回滚..."
          kubectl rollout undo deployment/eksjk-backend -n ${K8S_NAMESPACE} || true
          kubectl rollout undo deployment/eksjk-frontend -n ${K8S_NAMESPACE} || true
          echo "⏪ 回滚指令已发送，等待 Pod 恢复..."
          kubectl rollout status deployment/eksjk-backend -n ${K8S_NAMESPACE} --timeout=60s || true
          kubectl rollout status deployment/eksjk-frontend -n ${K8S_NAMESPACE} --timeout=60s || true
          echo "⚠️ 已回滚到上一个稳定版本"

      # ── 打印部署摘要 ──
      - name: 打印部署摘要
        if: success()
        run: |
          IMAGE_TAG="${{ needs.check-ci.outputs.image_tag }}"
          echo "================================================"
          echo "✅ Staging 部署成功"
          echo "环境: eksjk-staging"
          echo "镜像 Tag: ${IMAGE_TAG}"
          echo "触发分支: develop"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "================================================"
          kubectl get pods -n ${K8S_NAMESPACE}

  # ─────────────────────────────────────────────
  # Job: 部署结果通知（无论成功失败都执行）
  # ─────────────────────────────────────────────
  notify:
    name: 部署结果通知
    runs-on: ubuntu-latest
    needs: [check-ci, deploy]
    if: always() && needs.check-ci.result == 'success'

    steps:
      - name: 发送部署结果通知
        run: |
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          IMAGE_TAG="${{ needs.check-ci.outputs.image_tag }}"
          SHORT_SHA="${{ needs.check-ci.outputs.short_sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            STATUS_ICON="✅"
            STATUS_TEXT="部署成功"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="部署失败（已自动回滚）"
          fi

          echo "================================================"
          echo "${STATUS_ICON} Staging ${STATUS_TEXT}"
          echo "环境:     eksjk-staging"
          echo "分支:     develop"
          echo "Commit:   ${SHORT_SHA}"
          echo "镜像 Tag: ${IMAGE_TAG}"
          echo "耗时:     ${{ github.run_number }} 次运行"
          echo "详情:     ${RUN_URL}"
          echo "================================================"
          # 如需接入钉钉/企业微信，在此处添加 curl webhook 调用
