# 后端 Spring Boot Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eksjk-backend
  namespace: eksjk
  labels:
    app: eksjk-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eksjk-backend
  template:
    metadata:
      labels:
        app: eksjk-backend
    spec:
      # 等待 MySQL 就绪后再启动后端
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z eksjk-mysql.eksjk.svc.cluster.local 3306; do echo "等待 MySQL 就绪..."; sleep 3; done; echo "MySQL 已就绪"']
      containers:
        - name: backend
          image: eksjk-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: eksjk-mysql-secret
                  key: mysql-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eksjk-mysql-secret
                  key: mysql-password
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: config
              mountPath: /app/config/application-k8s.yml
              subPath: application-k8s.yml
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: eksjk-backend-config
        - name: uploads
          emptyDir: {}
