# Prometheus 数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eksjk-prometheus-pvc
  namespace: eksjk
  labels:
    app: eksjk-prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eksjk-prometheus
  namespace: eksjk
  labels:
    app: eksjk-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eksjk-prometheus
  template:
    metadata:
      labels:
        app: eksjk-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090
              name: http
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: eksjk-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: eksjk-prometheus-pvc
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: eksjk-prometheus
  namespace: eksjk
  labels:
    app: eksjk-prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: http
  selector:
    app: eksjk-prometheus
