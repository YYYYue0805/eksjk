# 前端 ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: eksjk-frontend
  namespace: eksjk
  labels:
    app: eksjk-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: eksjk-frontend
---
# 前端 NodePort Service（备选访问方式，当 Ingress 不可用时使用）
apiVersion: v1
kind: Service
metadata:
  name: eksjk-frontend-nodeport
  namespace: eksjk
  labels:
    app: eksjk-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30180
      protocol: TCP
      name: http
  selector:
    app: eksjk-frontend
