# 前端 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eksjk-frontend
  namespace: eksjk
  labels:
    app: eksjk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eksjk-frontend
  template:
    metadata:
      labels:
        app: eksjk-frontend
    spec:
      containers:
        - name: frontend
          image: eksjk-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: eksjk-frontend-config
