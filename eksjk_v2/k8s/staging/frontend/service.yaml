# Staging 前端 ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: eksjk-frontend
  namespace: eksjk-staging
  labels:
    app: eksjk-frontend
    env: staging
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: eksjk-frontend
