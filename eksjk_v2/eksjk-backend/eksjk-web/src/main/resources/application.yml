# EKSJK V2 后端 — 公共配置
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: eksjk-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # Caffeine 内存缓存配置
  cache:
    type: caffeine

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.eksjk.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix: ""
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  jwt-secret-key: eksjk-v2-jwt-secret-key-2024

# Actuator 健康检查 + Prometheus 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 日志配置
logging:
  level:
    root: INFO
    com.eksjk: DEBUG
    com.baomidou.mybatisplus: DEBUG

# 文件上传配置
eksjk:
  upload:
    # 本地开发环境使用MinIO模拟S3
    storage-type: s3
    # 对象存储配置
    s3:
      endpoint: http://localhost:9000  # MinIO默认端口
      region: us-east-1
      bucket: eksjk-files
      access-key: minioadmin  # MinIO默认用户名
      secret-key: minioadmin  # MinIO默认密码
      # 生产环境使用阿里云OSS
      # endpoint: https://oss-cn-hangzhou.aliyuncs.com
      # access-key: ${ALIYUN_ACCESS_KEY}
      # secret-key: ${ALIYUN_SECRET_KEY}
      # bucket: eksjk-prod-files