# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eksjk_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: eksjk
    password: eksjk123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# 文件上传配置
eksjk:
  upload:
    # 使用S3对象存储
    storage-type: s3
    # 对象存储配置（MinIO）
    s3:
      endpoint: http://localhost:9000  # MinIO默认端口
      region: us-east-1
      bucket: eksjk-files
      access-key: minioadmin  # MinIO默认用户名
      secret-key: minioadmin  # MinIO默认密码

# 日志配置
logging:
  level:
    root: INFO
    com.eksjk: DEBUG
    software.amazon.awssdk: DEBUG  # 开启S3 SDK调试日志