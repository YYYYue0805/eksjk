# 云端环境配置（阿里云 ACK 部署）
# 所有敏感配置通过 K8S Secret 环境变量注入
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# 文件上传配置 — 使用阿里云 OSS（S3 兼容协议）
eksjk:
  upload:
    storage-type: s3
    s3:
      endpoint: ${EKSJK_UPLOAD_S3_ENDPOINT}
      region: ${EKSJK_UPLOAD_S3_REGION:cn-shanghai}
      bucket: ${EKSJK_UPLOAD_S3_BUCKET}
      access-key: ${EKSJK_UPLOAD_S3_ACCESS_KEY}
      secret-key: ${EKSJK_UPLOAD_S3_SECRET_KEY}

# Sa-Token 密钥从环境变量获取
sa-token:
  jwt-secret-key: ${EKSJK_JWT_SECRET:eksjk-v2-jwt-secret-key-2024}

# 日志配置
logging:
  level:
    root: INFO
    com.eksjk: INFO
    software.amazon.awssdk: WARN
