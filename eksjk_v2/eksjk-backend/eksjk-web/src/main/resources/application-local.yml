# 本地开发环境配置（对应 Docker Compose 启动的 MySQL + MinIO）
# 使用方式：启动后端时指定 --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eksjk_local?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: eksjk
    password: eksjk123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: EksjkLocalHikariPool

  # 注意：本地环境不使用 Redis，缓存由 Caffeine（JVM 内存）提供
  # 不得在此处添加 spring.redis.* 配置

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # Spring Boot DevTools 热重载支持
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# 文件上传配置 - 本地使用 MinIO 模拟 OSS（S3 兼容协议）
eksjk:
  upload:
    storage-type: s3
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: eksjk-local
      access-key: minioadmin
      secret-key: minioadmin

# 本地开发日志级别（开启更多调试信息）
logging:
  level:
    root: INFO
    com.eksjk: DEBUG
    software.amazon.awssdk: DEBUG
    com.baomidou.mybatisplus: DEBUG
